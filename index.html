<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Double D Grocery</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
:root{--pri:#20d5ab;--bg:#000;--bg2:#0d0d0f;--card:#1c1c1e;--card2:#141416;--bd:#2a2a2c;--tx:#f5f5f7;--mut:#98989d;
--ok:#20d5ab;--due:#ffd60a;--over:#ff9f0a;--crit:#ff453a;--vio:#bf5af2;--blue:#0a84ff;
--r:18px;font-size:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter','SF Pro Text',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-size:20px;line-height:1;vertical-align:middle}
a{color:inherit;text-decoration:none}
/* top bar */
header{position:sticky;top:0;z-index:50;background:rgba(0,0,0,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--bd)}
.hbar{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:1200px;margin:0 auto}
.burger{width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--card2);display:grid;place-items:center;color:var(--tx);cursor:pointer;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16.5px;letter-spacing:-.2px}
.brand .mk{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--pri),#0fae8b);display:grid;place-items:center;color:#04241d;font-weight:900;font-size:13px}
.hsp{margin-left:auto;display:flex;align-items:center;gap:8px}
.hbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--card2);display:grid;place-items:center;color:var(--mut);cursor:pointer}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:80;opacity:0;pointer-events:none;transition:.25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:280px;max-width:82vw;background:var(--bg2);z-index:90;padding:22px 14px;transform:translateX(-102%);transition:transform .28s cubic-bezier(.4,0,.2,1);border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:4px}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:800}
.drawer a{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:13px;color:var(--mut);font-weight:600;font-size:15px;cursor:pointer}
.drawer a.on{background:rgba(32,213,171,.13);color:var(--pri)}
.drawer a:active{background:#1a1a1c}
.drawer .foot{margin-top:auto;color:var(--mut);font-size:11.5px;padding:10px}
main{max-width:1200px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom))}
h1{font-size:28px;font-weight:800;letter-spacing:-.5px}
.psub{color:var(--mut);font-size:13.5px;margin:4px 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card h2{font-size:16.5px;font-weight:700;display:flex;align-items:center;gap:9px;letter-spacing:-.2px}
.card .cs{color:var(--mut);font-size:12.5px;margin:3px 0 14px}
.grid{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px}
.stat .l{color:var(--mut);font-size:10.5px;letter-spacing:.08em;font-weight:600;text-transform:uppercase}
.stat .v{font-size:23px;font-weight:800;margin-top:6px;letter-spacing:-.4px}
.stat .d{font-size:11.5px;color:var(--mut);margin-top:2px}
/* segmented control */
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--bd);border-radius:11px;padding:3px;gap:2px}
.seg b{padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--mut);cursor:pointer;transition:.15s}
.seg b.on{background:#3a3a3c;color:var(--tx)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.chip{border:1px solid var(--bd);background:var(--card2);color:var(--mut);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--tx);color:#000;border-color:var(--tx)}
/* restock groups */
.ghead{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:16px 0 6px;color:var(--mut)}
.ghead .dot{width:8px;height:8px;border-radius:50%}
.item{padding:12px 2px;border-bottom:1px solid #232325;display:flex;flex-direction:column;gap:7px}
.item:last-child{border-bottom:none}
.item .r1{display:flex;align-items:center;gap:9px}
.item .nm{font-weight:600;font-size:14.5px;letter-spacing:-.1px}
.item .meta{color:var(--mut);font-size:11.5px;margin-left:auto;white-space:nowrap}
.ring{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:9.5px;font-weight:700;color:var(--mut)}
.bar{height:6px;border-radius:5px;background:#2b2b2d;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px}
.br{color:var(--mut);font-size:11px;display:flex;justify-content:space-between;align-items:center}
.snz{background:none;border:1px solid var(--bd);color:var(--mut);border-radius:9px;padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer}
.item.compact{flex-direction:row;align-items:center;padding:9px 2px}
.item.compact .bar{display:none}
.item.sn{opacity:.45}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mut);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;padding:9px 8px;border-bottom:1px solid var(--bd)}
td{padding:11px 8px;border-bottom:1px solid #1e1e20;font-size:13.5px}
.dense td{padding:6px 8px;font-size:12.5px}
.tag{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:8px;background:var(--card2);border:1px solid var(--bd);color:var(--mut)}
/* charts */
.mbar{display:flex;align-items:flex-end;gap:5px;height:140px;padding-top:6px}
.mbar .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;min-width:0}
.mbar .b i{width:100%;background:linear-gradient(180deg,var(--pri),rgba(32,213,171,.18));border-radius:5px 5px 0 0;min-height:3px}
.mbar .b span{font-size:8.5px;color:var(--mut);white-space:nowrap}
.spark{display:flex;align-items:flex-end;gap:3px;height:52px}
.spark i{flex:1;background:linear-gradient(180deg,var(--blue),rgba(10,132,255,.15));border-radius:3px 3px 0 0;min-height:3px}
/* forecast */
.fc{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.fc .big{font-size:26px;font-weight:800;letter-spacing:-.5px}
.fc .sub{color:var(--mut);font-size:12px}
.pillar{flex:1;min-width:130px;background:var(--card2);border:1px solid var(--bd);border-radius:14px;padding:13px 14px}
/* add shop */
.formrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
input,select{background:var(--card2);border:1px solid var(--bd);border-radius:12px;color:var(--tx);padding:11px 13px;font-family:inherit;font-size:14px;outline:none}
input:focus{border-color:var(--pri)}
.qchip{border:1px solid var(--bd);background:var(--card2);color:var(--tx);border-radius:12px;padding:9px 13px;font-size:13px;font-weight:600;cursor:pointer}
.qchip.sel{background:rgba(32,213,171,.15);border-color:var(--pri);color:var(--pri)}
.lineitem{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #202022}
.lineitem input{padding:8px 10px;font-size:13px}
.btn{background:var(--pri);color:#04241d;font-weight:700;border:none;border-radius:13px;padding:13px 20px;font-size:14.5px;cursor:pointer}
.btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--bd)}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #202022;gap:12px}
.setrow:last-child{border:none}
.pill{font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px}
.pill.ok{background:rgba(32,213,171,.14);color:var(--pri)}.pill.due{background:rgba(255,214,10,.12);color:var(--due)}
.mut{color:var(--mut)}.hide{display:none!important}
.insight{white-space:pre-wrap;font-size:13.5px;line-height:1.55}
@media(max-width:980px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:24px}}

.next{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-bottom:16px}
.dbar{position:relative;display:flex;align-items:center;gap:10px;padding:0 14px;height:48px;border-radius:13px;overflow:hidden;border:1px solid var(--bd);background:var(--card2);margin-bottom:8px}
.dbar.sm{height:38px}
.dbar i{position:absolute;left:0;top:0;bottom:0;z-index:0;transition:width .5s ease}
.dbar .lbl{position:relative;z-index:1;font-weight:600;font-size:14.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.1px}
.dbar .rt{position:relative;z-index:1;font-size:11px;color:var(--mut);white-space:nowrap}
.dbar.empty{border-color:rgba(255,159,10,.4)}
.dbar.empty .rt{color:var(--over);font-weight:600}
.dbar .snz{position:relative;z-index:1}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:70;height:40px;border-radius:20px;background:linear-gradient(135deg,var(--pri),#0fae8b);color:#04241d;font-weight:700;border:none;display:flex;align-items:center;gap:5px;padding:0 14px;box-shadow:0 5px 16px rgba(32,213,171,.26);cursor:pointer;font-size:12.5px;opacity:.92}
.fab:hover{opacity:1}
.fab:active{transform:scale(.96)}
.fab .material-symbols-outlined{font-size:17px}

.hero{background:linear-gradient(150deg,rgba(32,213,171,.13),var(--card) 60%);border:1px solid var(--bd);border-radius:20px;padding:22px;margin-bottom:16px}
.hero .hl{color:var(--mut);font-size:11px;letter-spacing:.1em;font-weight:600}
.hero .hamt{font-size:46px;font-weight:800;letter-spacing:-1.6px;margin:4px 0;line-height:1}
.hero .hd{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;margin-top:6px}
.acc{border-bottom:1px solid #232325}.acc:last-child{border-bottom:none}
.acch{display:flex;align-items:center;gap:12px;padding:14px 2px;cursor:pointer;user-select:none}
.acch .cico{font-size:22px;width:26px;text-align:center}
.acch .cnm{font-weight:600;font-size:15.5px;flex:1;letter-spacing:-.1px}
.acch .cct{font-size:12px;color:var(--mut)}
.acch .cct b{color:var(--over)}
.acch .chev{color:var(--mut);transition:transform .25s}
.acc.open .acch .chev{transform:rotate(180deg)}
.accb{max-height:0;overflow:hidden;transition:max-height .35s ease}
.acc.open .accb{max-height:3000px;padding-bottom:8px}
.dbar .ic{position:relative;z-index:1;font-size:16px;width:20px;text-align:center}
body[data-den="compact"] .card{padding:13px;margin-bottom:11px}
body[data-den="compact"] .hero{padding:16px}
body[data-den="compact"] .hero .hamt{font-size:38px}
body[data-den="compact"] .acch{padding:9px 2px;gap:10px}
body[data-den="compact"] .acch .cico{font-size:19px;width:22px}
body[data-den="compact"] .acch .cnm{font-size:14px}
body[data-den="compact"] .dbar{height:36px;margin-bottom:6px;gap:8px}
body[data-den="compact"] .dbar .lbl{font-size:13px}
body[data-den="compact"] .card h2{font-size:15px}
body[data-den="cozy"] .card{padding:20px}
body[data-den="cozy"] .acch{padding:16px 2px}
body[data-den="cozy"] .dbar{height:50px;margin-bottom:10px}
svg.trend{display:block;width:100%;height:auto}
</style></head>

function trendSvg(mm){if(!mm.length)return '<div class="mut">No data yet.</div>';
  const w=340,h=112,pl=6,pr=6,pt=16,pb=20;const vals=mm.map(m=>m.spent);const max=Math.max(...vals),min=Math.min(...vals),rng=max-min||1;
  const X=i=>pl+i*((w-pl-pr)/Math.max(mm.length-1,1));const Y=v=>pt+(1-(v-min)/rng)*(h-pt-pb);
  const pts=mm.map((m,i)=>X(i).toFixed(1)+','+Y(m.spent).toFixed(1));
  const line='M'+pts.join(' L');const area=`M${X(0).toFixed(1)},${h-pb} L`+pts.join(' L')+` L${X(mm.length-1).toFixed(1)},${h-pb} Z`;
  const dots=mm.map((m,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(m.spent).toFixed(1)}" r="2.4" fill="#0a84ff"/>`).join('');
  const maxi=vals.indexOf(max);
  const lab=(i,a)=>`<text x="${X(i).toFixed(1)}" y="${h-5}" fill="#98989d" font-size="9" text-anchor="${a}">${mm[i].ym.slice(2).replace('-','/')}</text>`;
  return `<svg class="trend" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a84ff" stop-opacity=".35"/><stop offset="1" stop-color="#0a84ff" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#tg)"/><path d="${line}" fill="none" stroke="#0a84ff" stroke-width="2"/>${dots}<text x="${X(maxi).toFixed(1)}" y="${(Y(max)-6).toFixed(1)}" fill="#f5f5f7" font-size="9.5" font-weight="700" text-anchor="middle">$${Math.round(max)}</text>${lab(0,'start')}${lab(mm.length-1,'end')}</svg>`;}
function fmtDM(d){d=new Date(d);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');}
function fortnightly(orders,n){
  const os=(orders||[]).filter(o=>o&&o.amt).map(o=>({t:new Date(o.d).getTime(),a:+o.amt})).filter(o=>!isNaN(o.t)).sort((x,y)=>x.t-y.t);
  if(!os.length)return [];
  const FN=14*86400000,start=os[0].t,b={};
  os.forEach(o=>{const i=Math.floor((o.t-start)/FN);b[i]=(b[i]||0)+o.a;});
  const maxI=Math.floor((os[os.length-1].t-start)/FN),arr=[];
  for(let i=0;i<=maxI;i++)arr.push({date:new Date(start+i*FN),spent:Math.round((b[i]||0)*100)/100});
  return n?arr.slice(-n):arr;
}
function spendChart(series){
  if(!series.length)return '<div class="mut">No data yet.</div>';
  const w=340,h=152,pl=32,pr=8,pt=22,pb=26,iw=w-pl-pr,ih=h-pt-pb;
  const vals=series.map(s=>s.spent),max=Math.max(...vals,1);
  const bw=iw/series.length,bar=Math.min(bw*0.6,20),Y=v=>pt+ih*(1-v/max);
  const bars=series.map((s,i)=>{const x=pl+i*bw+(bw-bar)/2,y=Y(s.spent);return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bar.toFixed(1)}" height="${Math.max(0,pt+ih-y).toFixed(1)}" rx="2.5" fill="#0a84ff"/>`;}).join('');
  const gl=[0,max/2,max].map(v=>{const y=Y(v);return `<line x1="${pl}" y1="${y.toFixed(1)}" x2="${w-pr}" y2="${y.toFixed(1)}" stroke="#2a2a2c" stroke-width="1"/><text x="${pl-5}" y="${(y+3).toFixed(1)}" fill="#8e8e93" font-size="9" text-anchor="end">$${Math.round(v)}</text>`;}).join('');
  const idxs=[...new Set([0,Math.floor(series.length/2),series.length-1])];
  const xl=idxs.map(i=>{const x=pl+i*bw+bw/2;return `<text x="${x.toFixed(1)}" y="${h-9}" fill="#8e8e93" font-size="9" text-anchor="middle">${fmtDM(series[i].date)}</text>`;}).join('');
  const legend=`<rect x="${pl}" y="6" width="9" height="9" rx="2" fill="#0a84ff"/><text x="${pl+14}" y="14" fill="#98989d" font-size="10">Spend per fortnight</text>`;
  return `<svg class="trend" viewBox="0 0 ${w} ${h}">${gl}${bars}${xl}${legend}</svg>`;
}

  <div class="setrow"><div><div style="font-weight:600">Coles warehouse</div><div class="mut" style="font-size:12px">auto-ingest via n8n · updated ${fmtD(D.stats.last_order)}</div></div><span class="pill ok">Connected</span></div>
  <div class="setrow"><div><div style="font-weight:600">Live feed</div><div class="mut" style="font-size:12px">data.json pushed by n8n every 6h</div></div><span class="pill ok">GitHub Pages</span></div>
  <div class="setrow"><div><div style="font-weight:600">Manual shops</div><div class="mut" style="font-size:12px">${manual.length} logged · ${manual.filter(m=>!m.synced).length} awaiting sync to warehouse</div></div><button class="snz" onclick="syncManual().then(render)">Sync now</button></div>
  <div class="setrow"><div><div style="font-weight:600">AI insights (Gemini)</div><div class="mut" style="font-size:12px">weekly trends & predictions</div></div><span class="pill ${INSIGHTS?'ok':'due'}">${INSIGHTS?'Active':'Set up in n8n'}</span></div></div>
  <div class="card"><h2>Snoozed items</h2><div class="cs">deferred to next shop</div>
  ${snl.length?snl.map(n=>`<div class="setrow"><span style="font-weight:600;font-size:13.5px">${n}</span><button class="snz" onclick="toggleSnooze('${n.replace(/'/g,"\\'")}')">Un-snooze</button></div>`).join(''):'<div class="mut">Nothing snoozed.</div>'}
  </div></div>`;
}
function render(){
  document.getElementById('fab').style.display=(state.view==='add')?'none':'flex';
  $('#fdates').textContent=fmtD(D.stats.first_order)+' – '+fmtD(D.stats.last_order);
  const v=state.view;
  if(v==='dash')renderDash();else if(v==='inv')renderInv();else if(v==='ord')renderOrd();else if(v==='add')renderAdd();else renderSet();
}
async function loadLive(force){
  try{const r=await fetch(LIVE_ENDPOINT+'?t='+Date.now(),{cache:'no-store'});if(r.ok){const j=await r.json();RAW=j.data||j;D=deriveFromRaw(RAW);}}catch(e){}
  try{const r2=await fetch(INSIGHTS_URL+'?t='+Date.now(),{cache:'no-store'});if(r2.ok){INSIGHTS=await r2.json();}}catch(e){}
  render();syncManual();
}
setDen(state.density);loadLive();
</script></body></html>
