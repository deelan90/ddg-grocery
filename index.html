<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Double D Grocery</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
:root{--pri:#20d5ab;--pri2:#12b593;--bg:#000;--bg2:#0a0b0b;--card:#161718;--card2:#0f1011;--bd:#282a2b;--tx:#f3f5f4;--mut:#888d90;--red:#ff5d70;--amb:#f6b53c;--vio:#a68bff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:radial-gradient(1200px 600px at 80% -10%,rgba(32,213,171,.06),transparent),var(--bg);color:var(--tx);display:flex;min-height:100vh;-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-size:20px;line-height:1;vertical-align:middle}
a{color:inherit;text-decoration:none}
aside{width:252px;border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 15px;flex-shrink:0;background:var(--bg2)}
.logo{display:flex;align-items:center;gap:11px;padding:6px 8px 20px}
.logo .mk{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;color:#04241d;font-weight:900;font-size:15px;box-shadow:0 6px 20px rgba(32,213,171,.35)}
.logo b{font-size:17px;font-weight:800;letter-spacing:-.2px}.logo .t{font-size:10.5px;color:var(--mut);font-weight:600}
nav{display:flex;flex-direction:column;gap:3px}
nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;color:var(--mut);font-weight:600;font-size:14px;cursor:pointer;transition:.15s}
nav a:hover{background:#141616;color:var(--tx)}
nav a.on{background:rgba(32,213,171,.13);color:var(--pri)}
.profile{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--card2)}
.profile .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--vio));display:grid;place-items:center;color:#04241d;font-weight:800}
.profile .nm{font-weight:700;font-size:13px}.profile .sub{color:var(--pri);font-size:11px;font-weight:600}
main{flex:1;min-width:0;padding:22px 30px 60px}
.top{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 14px;color:var(--mut)}
.search input{background:none;border:none;outline:none;color:var(--tx);width:100%;font-family:inherit;font-size:14px}
.top .est{margin-left:auto;text-align:right}.est .l{color:var(--mut);font-size:10px;letter-spacing:.14em;font-weight:700}.est .v{color:var(--pri);font-size:21px;font-weight:800}
.ico{width:42px;height:42px;border-radius:11px;border:1px solid var(--bd);background:var(--card);display:grid;place-items:center;color:var(--mut);cursor:pointer}
h1{font-size:25px;font-weight:800;letter-spacing:-.4px}
.psub{color:var(--mut);font-size:13px;margin:2px 0 20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:16px 17px;position:relative;overflow:hidden}
.stat .ic2{position:absolute;right:12px;top:12px;color:var(--pri);opacity:.85}
.stat .l{color:var(--mut);font-size:10.5px;letter-spacing:.1em;font-weight:700;text-transform:uppercase}
.stat .v{font-size:25px;font-weight:800;margin-top:7px}.stat .d{font-size:11.5px;color:var(--mut);margin-top:2px}
.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:start}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:19px}
.card h2{font-size:16px;font-weight:800;display:flex;align-items:center;gap:9px}
.card .cs{color:var(--mut);font-size:12px;margin:3px 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.chip{border:1px solid var(--bd);background:var(--card2);color:var(--mut);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--pri);color:#04241d;border-color:var(--pri)}
.chip.star.on{background:linear-gradient(135deg,#ffd76a,#f6b53c);border-color:#f6b53c;color:#3a2a00}
.tierhd{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--amb);margin:6px 0 4px}
.item{padding:11px 0;border-bottom:1px solid #202223}.item:last-child{border-bottom:none}
.item.sn{opacity:.5}
.item .r1{display:flex;align-items:center;gap:9px}
.item .nm{font-weight:700;font-size:13.5px}
.item .star{color:#f6b53c;font-size:15px}
.item .meta{color:var(--mut);font-size:11.5px;margin-left:auto;text-align:right;white-space:nowrap}
.pill{font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;letter-spacing:.03em;text-transform:uppercase}
.pill.over{background:rgba(255,93,112,.16);color:var(--red)}.pill.due{background:rgba(246,181,60,.16);color:var(--amb)}.pill.ok{background:rgba(32,213,171,.14);color:var(--pri)}.pill.sn{background:rgba(166,139,255,.16);color:var(--vio)}
.bar{height:7px;border-radius:6px;background:#252728;margin-top:8px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:6px}
.br{color:var(--mut);font-size:11px;margin-top:5px;display:flex;justify-content:space-between;align-items:center}
.snz{background:none;border:1px solid var(--bd);color:var(--mut);border-radius:8px;padding:3px 9px;font-size:11px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.snz:hover{border-color:var(--vio);color:var(--vio)}
.catrow{margin-bottom:12px}.catrow .t{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:6px}.catrow .t span:last-child{color:var(--mut)}
.ord{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #202223}.ord:last-child{border:none}
.ord .oi{width:34px;height:34px;border-radius:9px;background:rgba(32,213,171,.12);color:var(--pri);display:grid;place-items:center}
.ord .amt{margin-left:auto;font-weight:800}
.mut{color:var(--mut)} .hide{display:none!important}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mut);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:10px 10px;border-bottom:1px solid var(--bd)}
td{padding:12px 10px;border-bottom:1px solid #1c1e1f;font-size:13px}
tr:hover td{background:#101112}
.tag{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:7px;background:var(--card2);border:1px solid var(--bd);color:var(--mut)}
.spark{display:flex;align-items:flex-end;gap:4px;height:60px}
.spark i{flex:1;background:linear-gradient(180deg,var(--pri),rgba(32,213,171,.25));border-radius:3px 3px 0 0;min-height:3px}
.mbar{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:8px}
.mbar .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.mbar .b i{width:100%;background:linear-gradient(180deg,var(--pri),rgba(32,213,171,.22));border-radius:4px 4px 0 0;min-height:3px}
.mbar .b span{font-size:9px;color:var(--mut);transform:rotate(-40deg);white-space:nowrap}
.toggle{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--mut);cursor:pointer}
.sw{width:38px;height:22px;border-radius:999px;background:#2a2c2d;position:relative;transition:.2s}
.sw i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--pri)}.sw.on i{left:18px}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #202223}.setrow:last-child{border:none}
.note{margin-top:26px;color:var(--mut);font-size:11.5px;text-align:center;border-top:1px solid var(--bd);padding-top:16px}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:3px}
.seg b{padding:6px 14px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--mut);cursor:pointer}
.seg b.on{background:var(--pri);color:#04241d}
@media(max-width:1050px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}main{padding:16px 14px 88px}.top{flex-wrap:wrap}.search{max-width:none;order:3;flex-basis:100%}aside{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;flex-direction:row;border-right:none;border-top:1px solid var(--bd);padding:5px 2px;z-index:60;justify-content:space-around;background:var(--bg2)}.logo,.profile,.addbtn{display:none}nav{flex-direction:row;justify-content:space-around;width:100%;gap:0}nav a{flex-direction:column;font-size:9.5px;gap:2px;padding:7px 6px;border-radius:9px;text-align:center;line-height:1.1}nav a.on{background:transparent;color:var(--pri)}}

<script>
// ====== live-ready: set to your n8n webhook URL to auto-refresh ======
const LIVE_ENDPOINT = "https://raw.githubusercontent.com/deelan90/ddg-grocery/main/data.json"; // n8n pushes fresh data here on a schedule

const CUTOFF_DAYS=210;
const PROMO=new Set(['down down','easter','christmas','back to school','bonus prize entries','bonus disc range','bonus ovenware credits','bonus credit products','next day delivery range']);
const FIXC={'dairy, eggs & fridge':'Dairy, Eggs & Fridge','meat & seafood':'Meat & Seafood','fruit & vegetables':'Fruit & Vegetables','health & beauty':'Health & Beauty','chips, chocolates & snacks':'Chips, Chocolates & Snacks','cleaning & laundry':'Household','household':'Household','pantry':'Pantry','frozen':'Frozen','drinks':'Drinks','bakery':'Bakery','deli':'Deli','pet':'Pet','back to school':'Specials & Seasonal'};
function canon(n){const k=(n||'').trim().toLowerCase(); if(PROMO.has(k))return 'Specials & Seasonal'; return FIXC[k]||(n||'').trim();}
function deriveFromRaw(raw){
  const today=new Date(); const cutoff=new Date(today.getTime()-CUTOFF_DAYS*86400000);
  const cm={}; (raw.categories||[]).forEach(c=>{const k=canon(c.category);(cm[k]=cm[k]||{category:k,spent:0,products:0});cm[k].spent+=c.spent||0;cm[k].products+=c.products||0;});
  const cats=Object.values(cm).sort((a,b)=>b.spent-a.spent);
  const burn=[]; (raw.burndown||[]).forEach(b=>{const lb=b.last_bought?new Date(b.last_bought):null;const ad=b.avg_days;const seen=b.seen||0;
    if(!lb||!ad||ad<=0)return; if(lb<cutoff)return;
    burn.push({name:b.product_name,brand:(b.brand||'').trim(),category:canon(b.category),seen:seen,avg_days:Math.round(ad*10)/10,last_bought:b.last_bought,importance:Math.round(seen*(30/ad)*100)/100,staple:(seen>=15&&ad<=50)});});
  burn.sort((a,b)=>b.importance-a.importance);
  const bmap={}; (raw.burndown||[]).forEach(b=>bmap[b.product_name]=b);
  const inv=(raw.catalog||[]).map(p=>{const b=bmap[p.product_name];const oc=p.orders_count||0;
    return {name:p.product_name,brand:(p.brand||'').trim(),category:canon(p.category),times:oc,spent:Math.round((p.total_spent||0)*100)/100,avg_cost:Math.round((p.total_spent||0)/Math.max(oc,1)*100)/100,first_buy:p.first_buy,last_buy:p.last_buy,avg_days:(b&&b.avg_days)?Math.round(b.avg_days*10)/10:null};});
  inv.sort((a,b)=>b.times-a.times);
  return {stats:Object.assign({},raw.stats,{products:(raw.catalog||[]).length}),cats:cats,burn:burn,inv:inv,orders:raw.orders||[],monthly:raw.monthly||[],staples_count:burn.filter(x=>x.staple).length};
}

let RAW_EMBED = JSON.parse(document.getElementById('d').textContent);
let D = deriveFromRaw(RAW_EMBED);
const TODAY = new Date();
const $=s=>document.querySelector(s);
const money=n=>'$'+(n||0).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>'$'+Math.round(n||0).toLocaleString('en-AU');
const daysBetween=(a,b)=>Math.round((b-a)/86400000);
const SNOOZE_KEY='ddg_snooze_v1';
function snoozed(){try{return JSON.parse(localStorage.getItem(SNOOZE_KEY)||'{}')}catch(e){return {}}}
function toggleSnooze(name){const s=snoozed();if(s[name])delete s[name];else s[name]=true;localStorage.setItem(SNOOZE_KEY,JSON.stringify(s));render();}
// burn-down derived
function withUrg(b){const lb=new Date(b.last_bought);const ds=daysBetween(lb,TODAY);const pct=b.avg_days>0?ds/b.avg_days*100:0;const over=ds-Math.round(b.avg_days);
  let st=['ok','On track'];if(pct>=100)st=['over','Overdue'];else if(pct>=75)st=['due','Due soon'];
  return {...b,ds,pct:Math.round(pct*10)/10,over,st};}
function statusColor(p){return p>=100?'var(--red)':p>=75?'var(--amb)':'var(--pri)';}

let state={view:'dash',tab:'⭐ Staples',invCat:'All',ordView:'list',q:''};

function setView(v){state.view=v;document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));render();}
document.querySelectorAll('#nav a').forEach(a=>a.onclick=()=>setView(a.dataset.v));
$('#q').oninput=e=>{state.q=e.target.value.toLowerCase().trim();render();};
$('#refresh').onclick=loadLive;

function render(){
  $('#estv').textContent=money0(D.stats.avg_order);
  $('#foot').textContent='Live snapshot · '+D.stats.orders+' orders · '+D.stats.first_order+' – '+D.stats.last_order+' · Double D Grocery';
  const v=state.view;
  if(v==='dash')renderDash();else if(v==='inv')renderInv();else if(v==='ord')renderOrd();else renderSet();
}

function statCards(){
  const st=[['Total spent',money0(D.stats.total_spent),'across all orders','payments'],
  ['Orders',D.stats.orders,D.stats.first_order+' → '+D.stats.last_order,'receipt_long'],
  ['Avg per shop',money0(D.stats.avg_order),'basket size','shopping_cart'],
  ['Products tracked',D.stats.products,D.staples_count+' flagged staples','inventory_2']];
  return '<div class="stats">'+st.map(s=>`<div class="stat"><span class="material-symbols-outlined ic2">${s[3]}</span><div class="l">${s[0]}</div><div class="v">${s[1]}</div><div class="d">${s[2]}</div></div>`).join('')+'</div>';
}

function renderDash(){
  const sn=snoozed();
  const burn=D.burn.map(withUrg);
  const overdueCount=burn.filter(b=>b.pct>=100 && !sn[b.name]).length;
  // tabs
  const catset=Array.from(new Set(D.burn.map(b=>b.category)));
  const tabs=['⭐ Staples','All',...catset.slice(0,7)];
  if(!tabs.includes(state.tab))state.tab='⭐ Staples';
  // filter list
  let list;
  if(state.tab==='⭐ Staples')list=burn.filter(b=>b.staple);
  else if(state.tab==='All')list=burn.slice();
  else list=burn.filter(b=>b.category===state.tab);
  if(state.q)list=list.filter(b=>(b.name+' '+b.brand).toLowerCase().includes(state.q));
  // sort: non-snoozed first, then staple, then importance, then urgency
  list.sort((a,b)=>{const sa=sn[a.name]?1:0,sb=sn[b.name]?1:0;if(sa!==sb)return sa-sb;
    if(a.staple!==b.staple)return b.staple-a.staple;
    if(state.tab==='⭐ Staples')return b.pct-a.pct;
    return b.importance-a.importance;});
  list=list.slice(0,18);
  const rowHtml=b=>{const isn=!!sn[b.name];const [cls,lbl]=isn?['sn','Snoozed']:b.st;const w=Math.min(b.pct,100);
    const over=isn?'next shop':(b.over>0?b.over+'d overdue':'due in '+(-b.over)+'d');
    return `<div class="item ${isn?'sn':''}"><div class="r1">${b.staple?'<span class="material-symbols-outlined star" title="Household staple">star</span>':''}<span class="nm">${b.name}</span><span class="pill ${cls}">${lbl}</span><span class="meta">${b.brand||'—'} · ~${Math.round(b.avg_days)}d · ${b.seen}×</span></div>
      <div class="bar"><i style="width:${w}%;background:${isn?'var(--vio)':statusColor(b.pct)}"></i></div>
      <div class="br"><span>last bought ${b.last_bought}</span><span style="display:flex;gap:10px;align-items:center">${over}<button class="snz" onclick="toggleSnooze('${b.name.replace(/'/g,"\\'")}')"><span class="material-symbols-outlined" style="font-size:15px">${isn?'undo':'snooze'}</span>${isn?'Un-snooze':'Snooze'}</button></span></div></div>`;};
  const chips=tabs.map(t=>`<div class="chip ${t==='⭐ Staples'?'star':''} ${t===state.tab?'on':''}" onclick="state.tab='${t.replace(/'/g,"\\'")}';render()">${t}</div>`).join('');
  // categories
  const maxc=Math.max(...D.cats.map(c=>c.spent));
  const catHtml=D.cats.slice(0,9).map(c=>`<div class="catrow"><div class="t"><span>${c.category}</span><span>${money0(c.spent)}</span></div><div class="bar"><i style="width:${(c.spent/maxc*100).toFixed(1)}%;background:var(--pri)"></i></div></div>`).join('');
  // recent
  const rec=D.orders.slice(0,7).map(o=>`<div class="ord"><div class="oi"><span class="material-symbols-outlined">shopping_bag</span></div><div><div style="font-weight:700;font-size:13px">Order #${o.ordno}</div><div class="mut" style="font-size:11.5px">${o.d} · ${o.items} items</div></div><div class="amt">${money(o.amt)}</div></div>`).join('');
  // spark (monthly last 12)
  const mm=D.monthly.slice(-12);const maxm=Math.max(...mm.map(m=>m.spent));
  const spark='<div class="spark">'+mm.map(m=>`<i style="height:${(m.spent/maxm*100)}%" title="${m.ym}: ${money0(m.spent)}"></i>`).join('')+'</div>';
  $('#view').innerHTML=`<h1>Dashboard</h1><div class="psub">${D.stats.orders} orders · ${money(D.stats.total_spent)} spent · avg ${money(D.stats.avg_order)}/shop · <b style="color:${overdueCount?'var(--red)':'var(--pri)'}">${overdueCount} items overdue</b></div>
  ${statCards()}
  <div class="grid"><div class="card">
    <h2><span class="material-symbols-outlined" style="color:var(--red)">local_fire_department</span>Restock Radar</h2>
    <div class="cs">Ranked by purchase priority — how often & how much you buy it. Staples are tracked first. Bar = % of your usual cycle elapsed.</div>
    <div class="chips">${chips}</div>${list.map(rowHtml).join('')||'<div class="mut" style="padding:14px 0">Nothing here.</div>'}
  </div>
  <div><div class="card" style="margin-bottom:18px"><h2><span class="material-symbols-outlined" style="color:var(--pri)">trending_up</span>Spend Trend</h2><div class="cs">Last 12 months</div>${spark}</div>
  <div class="card" style="margin-bottom:18px"><h2><span class="material-symbols-outlined" style="color:var(--pri)">pie_chart</span>Spend by Category</h2><div class="cs">All-time</div>${catHtml}</div>
  <div class="card"><h2><span class="material-symbols-outlined" style="color:var(--pri)">history</span>Recent Orders</h2><div class="cs">Latest deliveries</div>${rec}</div></div></div>`;
}

function renderInv(){
  const cats=['All',...Array.from(new Set(D.inv.map(i=>i.category)))];
  let list=D.inv.slice();
  if(state.invCat!=='All')list=list.filter(i=>i.category===state.invCat);
  if(state.q)list=list.filter(i=>(i.name+' '+i.brand).toLowerCase().includes(state.q));
  const chips=cats.slice(0,12).map(c=>`<div class="chip ${c===state.invCat?'on':''}" onclick="state.invCat='${c.replace(/'/g,"\\'")}';render()">${c}</div>`).join('');
  const rows=list.slice(0,120).map(i=>{
    const b=D.burn.find(x=>x.name===i.name);const urg=b?withUrg(b):null;
    const stock=urg?Math.max(0,Math.min(100,100-urg.pct)):null;
    const stockbar=stock===null?'<span class="mut">—</span>':`<div class="bar" style="width:80px;margin:0"><i style="width:${stock}%;background:${statusColor(urg.pct)}"></i></div>`;
    return `<tr><td><div style="font-weight:700">${i.name}</div><div class="mut" style="font-size:11px">${i.brand||''}</div></td><td><span class="tag">${i.category}</span></td><td>${i.last_buy||'—'}</td><td>${i.times}×</td><td>${i.avg_days?('~'+Math.round(i.avg_days)+'d'):'<span class=mut>irregular</span>'}</td><td>${stockbar}</td><td style="font-weight:700">${money(i.avg_cost)}</td></tr>`;}).join('');
  $('#view').innerHTML=`<h1>Inventory</h1><div class="psub">${D.inv.length} products tracked from your order history · showing purchase cadence & estimated stock</div>
  ${statCards()}
  <div class="card"><h2><span class="material-symbols-outlined" style="color:var(--pri)">inventory_2</span>All Products</h2><div class="cs">Estimated stock = how much of the usual cycle remains since last purchase</div>
  <div class="chips">${chips}</div>
  <table><thead><tr><th>Item</th><th>Category</th><th>Last bought</th><th>Bought</th><th>Cadence</th><th>Est. stock</th><th>Avg cost</th></tr></thead><tbody>${rows}</tbody></table>
  ${list.length>120?'<div class="mut" style="padding:12px 0 0;text-align:center">Showing 120 of '+list.length+' — search or filter to narrow.</div>':''}</div>`;
}

function renderOrd(){
  const mm=D.monthly;const maxm=Math.max(...mm.map(m=>m.spent));
  const chart='<div class="mbar">'+mm.map(m=>`<div class="b"><i style="height:${(m.spent/maxm*100)}%" title="${money0(m.spent)}"></i><span>${m.ym}</span></div>`).join('')+'</div>';
  let list=D.orders.slice();
  if(state.q)list=list.filter(o=>o.ordno.includes(state.q));
  const rows=list.map(o=>`<tr><td style="font-weight:700">#${o.ordno}</td><td>${o.d}</td><td>${o.items} items</td><td style="font-weight:800">${money(o.amt)}</td><td><span class="pill ok">Delivered</span></td></tr>`).join('');
  $('#view').innerHTML=`<h1>Order History</h1><div class="psub">${D.orders.length} Coles orders · ${money(D.stats.total_spent)} total · avg ${money(D.stats.avg_order)}</div>
  ${statCards()}
  <div class="card" style="margin-bottom:18px"><h2><span class="material-symbols-outlined" style="color:var(--pri)">bar_chart</span>Monthly Spend</h2><div class="cs">${mm[0].ym} – ${mm[mm.length-1].ym}</div>${chart}</div>
  <div class="card"><h2><span class="material-symbols-outlined" style="color:var(--pri)">receipt_long</span>All Orders</h2><div class="cs">Every delivery, newest first</div>
  <table><thead><tr><th>Order</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderSet(){
  const sn=snoozed();const snList=Object.keys(sn);
  const toggle=(id,on,lbl,sub)=>`<div class="setrow"><div><div style="font-weight:600;font-size:14px">${lbl}</div><div class="mut" style="font-size:12px">${sub}</div></div><div class="sw ${on?'on':''}" onclick="this.classList.toggle('on')"><i></i></div></div>`;
  $('#view').innerHTML=`<h1>Settings</h1><div class="psub">Manage Double D Grocery preferences & data source</div>
  <div class="grid"><div class="card"><h2><span class="material-symbols-outlined" style="color:var(--pri)">account_circle</span>Household</h2><div class="cs">Your grocery profile</div>
    <div class="setrow"><div><div style="font-weight:600">Household name</div><div class="mut" style="font-size:12px">Double D Grocery</div></div><span class="tag">2 people</span></div>
    <div class="setrow"><div><div style="font-weight:600">Primary store</div><div class="mut" style="font-size:12px">Coles Online · North Lakes / delivery</div></div><span class="tag">Coles</span></div>
    ${toggle('n1',true,'Restock reminders','Alert when staples pass their cycle')}
    ${toggle('n2',true,'Weekly shop digest','Summary before your usual shop day')}
    ${toggle('n3',false,'Price-drop alerts','When a tracked item goes on special')}
  </div>
  <div><div class="card" style="margin-bottom:18px"><h2><span class="material-symbols-outlined" style="color:var(--pri)">database</span>Data Source</h2><div class="cs">Where your grocery data comes from</div>
    <div class="setrow"><div><div style="font-weight:600">Postgres warehouse</div><div class="mut" style="font-size:12px">orders · order_line_items · items · consumption_metrics</div></div><span class="pill ok">Connected</span></div>
    <div class="setrow"><div><div style="font-weight:600">Auto-ingest new orders</div><div class="mut" style="font-size:12px">n8n reads Coles emails → warehouse</div></div><span class="pill ok">Active</span></div>
    <div class="setrow"><div><div style="font-weight:600">Live refresh</div><div class="mut" style="font-size:12px">${LIVE_ENDPOINT?'Fetching from n8n webhook':'Snapshot — add an n8n webhook to go live'}</div></div><span class="pill ${LIVE_ENDPOINT?'ok':'due'}">${LIVE_ENDPOINT?'Live':'Snapshot'}</span></div>
  </div>
  <div class="card"><h2><span class="material-symbols-outlined" style="color:var(--vio)">snooze</span>Snoozed Items</h2><div class="cs">Overdue items you've deferred to the next shop</div>
    ${snList.length?snList.map(n=>`<div class="setrow"><div style="font-weight:600;font-size:13px">${n}</div><button class="snz" onclick="toggleSnooze('${n.replace(/'/g,"\\'")}')"><span class="material-symbols-outlined" style="font-size:15px">undo</span>Un-snooze</button></div>`).join(''):'<div class="mut" style="padding:12px 0">Nothing snoozed. Snooze items from the Restock Radar to defer them.</div>'}
  </div></div></div>`;
}

async function loadLive(){
  if(!LIVE_ENDPOINT){render();return;}
  try{const r=await fetch(LIVE_ENDPOINT+((LIVE_ENDPOINT.includes('?')?'&':'?')+'t='+Date.now()),{cache:'no-store'});const j=await r.json();D=deriveFromRaw(j.data||j);render();}
  catch(e){render();}
}
loadLive();
</script>
</body></html>
